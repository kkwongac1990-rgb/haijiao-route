<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海角灯塔骑行路线 - 高德版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#map { width: 100vw; height: 100vh; }
.panel {
  position: fixed; top: 12px; left: 12px;
  background: rgba(255,255,255,0.95);
  border-radius: 10px; padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  font-size: 13px; color: #333; z-index: 1000;
  line-height: 1.8;
}
.panel strong { color: #722ed1; }
.sitemarker {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  background: #722ed1; color: #fff;
  border-radius: 50% 50% 50% 0;
  font-size: 12px; font-weight: 700;
  transform: rotate(-45deg);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  border: 2px solid #fff;
}
.sitemarker span { transform: rotate(45deg); }
</style>
</head>
<body>

<div class="panel">
  <strong>🚴 海角灯塔骑行路线</strong><br/>
  📍 站点：11<br/>
  📏 总里程：约 62km<br/>
  🗺️ 高德地图（GCJ-02）
</div>

<div id="map"></div>

<script>
window._AMapSecurityConfig = { securityJsCode: 'ef1acd094d64d265ebf623fbdb8a5de9' };
</script>
<script src="https://webapi.amap.com/maps?key=93ff6783bfbbf5c31443bab1cb77303a&v=2.0&plugin=AMap.Scale"></script>

<script>
const WAYPOINTS = [
  [114.808019, 22.809813, '0 海角灯塔', '~15m'],
  [114.807269, 22.770054, '1 湿地公园', '~3m'],
  [114.756744, 22.685943, '2 巽寮湾风景区', '~5m'],
  [114.756214, 22.588611, '3 碧甲湾赶海公园', '~3m'],
  [114.871703, 22.602363, '4 双月湾', '~3m'],
  [114.893090, 22.572370, '5 情人堤', '~2m'],
  [114.896402, 22.557650, '6 大星山观景台', '~80m'],
  [114.922888, 22.628974, '7 情人岛', '~5m'],
  [114.957151, 22.666186, '8 黑排角', '~10m'],
  [114.971649, 22.680022, '9 湾仔村', '~8m'],
  [114.949248, 22.680057, '10 黑牌脚', '~15m'],
];

const map = new AMap.Map('map', {
  viewMode: '2D', zoom: 11,
  center: [WAYPOINTS[5][0], WAYPOINTS[5][1]],
  mapStyle: 'amap://styles/normal',
});
map.addControl(new AMap.Scale());

const shadowLine = new AMap.Polyline({
  path: WAYPOINTS, strokeColor: '#d3adf7',
  strokeOpacity: 0.3, strokeWeight: 10, zIndex: 49,
});
map.add(shadowLine);

const mainLine = new AMap.Polyline({
  path: WAYPOINTS, strokeColor: '#722ed1',
  strokeOpacity: 0.85, strokeWeight: 5, zIndex: 50,
});
map.add(mainLine);

WAYPOINTS.forEach((wp, i) => {
  const el = document.createElement('div');
  el.className = 'sitemarker';
  el.innerHTML = `<span>${i}</span>`;
  const marker = new AMap.Marker({
    position: [wp[0], wp[1]], content: el,
    offset: new AMap.Pixel(-14, -14), zIndex: 100 + i,
  });
  marker.on('click', () => {
    new AMap.InfoWindow({
      content: `<div style="padding:8px;font-size:13px;line-height:1.8">
        <strong>${wp[2]}</strong><br/>⛰️ ${wp[3]}<br/>GCJ-02: ${wp[0].toFixed(6)}, ${wp[1].toFixed(6)}
      </div>`,
      offset: new AMap.Pixel(0, -30),
    }).open(map, marker.getPosition());
  });
  map.add(marker);
});

map.setFitView([mainLine], false, [50, 50, 50, 50]);
</script>
</body>
</html>
